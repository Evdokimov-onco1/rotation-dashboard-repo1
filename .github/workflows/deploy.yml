# Деплой на виртуальный хостинг Timeweb при пуше в main.
# Требуемые секреты репозитория — см. docs/DEPLOY.md, раздел 6.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка секретов деплоя
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_WEBROOT: ${{ secrets.DEPLOY_WEBROOT }}
          DEPLOY_BACKEND_DIR: ${{ secrets.DEPLOY_BACKEND_DIR }}
        run: |
          missing=""
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_WEBROOT DEPLOY_BACKEND_DIR; do
            [ -z "$(eval echo "\$$v")" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заполнены секреты:$missing. Настройте их по docs/DEPLOY.md (раздел 6) и перезапустите workflow."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Сборка фронтенда
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Сборка артефакта сайта (webroot)
        run: |
          mkdir site
          cp -r frontend/dist/. site/
          cp deploy/root.htaccess site/.htaccess
          cp -r backend/api site/api

      - name: Ключ SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Секрет может быть либо самим ключом (BEGIN…END), либо его base64 в одну строку
          # (вывод `base64 -w0 ~/.ssh/rotation_deploy`). Из веб-консоли хостинга текст приходит
          # с хвостами пробелов и \r — вычищаем.
          if printf '%s' "$DEPLOY_SSH_KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' | sed '/^$/d' > ~/.ssh/deploy_key
          else
            printf '%s' "$DEPLOY_SSH_KEY" | tr -d ' \t\r\n' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::Секрет DEPLOY_SSH_KEY не читается как ключ. Скопируйте файл ~/.ssh/rotation_deploy целиком (от BEGIN до END) и сохраните секрет заново."
            exit 1
          fi
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Деплой webroot (статика + api)
        run: |
          rsync -az --delete --exclude 'rotation-config.php' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT || 22 }}" \
            site/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_WEBROOT }}/"

      - name: Деплой backend вне webroot (cron, init_db, seed)
        run: |
          rsync -az --delete --exclude 'config.php' --exclude 'logs' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT || 22 }}" \
            backend data "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_BACKEND_DIR }}/"
